title: Himanshu Sharma
description: Applied scientist working on robot learning, manipulation, perception, and multimodal AI.
url: https://magician6174.github.io
baseurl: ""
author: Himanshu Sharma

include:
  - _pages

plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:path/
  blogs:
    output: true
    permalink: /blog/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
